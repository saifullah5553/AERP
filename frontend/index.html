<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AERP — Equity Research Terminal</title>
    <meta name="color-scheme" content="dark" />

    <!-- PWA. `theme-color` is what paints the Android status bar; without it an installed
         app shows a white strip above a dark terminal. -->

    <meta name="theme-color" content="#0b0f19" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AERP" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
