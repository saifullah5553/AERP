name: Populate Live Backend

# For the fully-live (free) path: runs the pipeline against a real Postgres
# (Neon free tier) so a deployed backend (Render free web service) serves live data.
# Does nothing until you add the DATABASE_URL secret. See docs/DEPLOY-FREE.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *" # every 6 hours, offset from the demo refresh

concurrency:
  group: populate-backend
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    # The schedule above fires every 6 hours and GitHub's DEFAULT job timeout is also 6 hours.
    # Those being the same number is the trap: a run that goes long is cancelled at exactly the
    # moment the next one is due, and by then that next one is already queued. From there they
    # overlap permanently and report "All jobs were cancelled" - which reads like an outage
    # rather than what it is, a job that ran out of time with nothing to show for it.
    #
    # The budget has to be larger than the sum of the per-step budgets below, or the job kills
    # itself part-way and reports the same unexplained cancellation this was meant to end:
    #
    #   7 ingests x 10 min      70
    #   compute                 40
    #   checkout / pip / unpack  5
    #   worst case             115   <  150, with headroom, and far inside the 6-hour interval
    #
    # Change one of those numbers and change this one with it.
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AERP_PSX_CSV_DIR: ../data/psx_csv
      AERP_PSX_INSIDER_CSV: ../data/psx_insider.csv
      AERP_SEED_ON_STARTUP: "false"
    steps:
      - name: Check for DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Set the DATABASE_URL repo secret (Neon) to enable the live backend."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - if: env.SKIP != '1'
        uses: actions/checkout@v4
      - if: env.SKIP != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: env.SKIP != '1'
        run: pip install -r backend/requirements.txt

      - if: env.SKIP != '1'
        name: Unpack PSX CSV inputs
        run: |
          mkdir -p data/psx_csv
          tar xzf data/psx_csv.tar.gz -C data

      - if: env.SKIP != '1'
        name: Migrate + ingest + compute (live DB)
        working-directory: backend
        run: |
          set -u
          # These two are the job: without a schema and a seeded universe there is nothing to
          # ingest into. They are deliberately NOT tolerated.
          alembic upgrade head
          python -m app.cli seed

          # The rest are individually optional - one dead upstream feed should not cost the
          # other six - but "optional" was doing more work than intended. Every one ended in
          # `|| true`, so a run where all of them failed finished green having ingested
          # nothing at all. Count them, print the tally, and fail if none survived.
          OK=0; FAILED=""
          run_step() {
            NAME="$1"; shift
            # Bounded individually: an ingest that hangs on a network read otherwise consumes
            # the whole job budget and takes the steps after it down with it. 10 minutes each,
            # so all seven together still leave room for compute - see timeout-minutes above.
            if timeout 600 "$@"; then
              OK=$((OK + 1))
            else
              FAILED="$FAILED $NAME"
              echo "::warning::$NAME failed or timed out"
            fi
          }
          run_step load-us-universe  python -m app.cli load-us-universe
          run_step ingest-psx        python -m app.cli ingest-psx
          run_step ingest-psx-market python -m app.cli ingest-psx-market
          run_step ingest-macro      python -m app.cli ingest-macro
          run_step ingest-psx-insider python -m app.cli ingest-psx-insider
          run_step ingest-insider    python -m app.cli ingest-insider --limit 150
          run_step ingest-news       python -m app.cli ingest-news --limit 60

          # compute is the point of the run - everything above only feeds it. A green job that
          # skipped it is the failure mode worth catching, so it is bounded but not tolerated.
          timeout 2400 python -m app.cli compute

          echo "Ingest steps succeeded: $OK of 7${FAILED:+ (failed:$FAILED)}"
          if [ "$OK" -eq 0 ]; then
            echo "::error::every ingest step failed - refusing to report success"
            exit 1
          fi
