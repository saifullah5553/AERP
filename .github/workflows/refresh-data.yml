name: Refresh Demo Data

# The free "worker/beat": runs the whole pipeline on a schedule (GitHub Actions is
# free for public repos), regenerates the real data snapshot, commits it for the
# record, then builds and deploys the Pages site — all in one run. No server, no
# database, no external account.
#
# (Deploy is done here rather than by triggering Deploy Pages, because pushes made
# with the default GITHUB_TOKEN do not trigger other workflows.)
on:
  schedule:
    # Deliberately NOT "*/30" (i.e. :00 and :30). Measured over 8 days on that cron, GitHub
    # actually STARTED this workflow 3-7 times a day instead of 48 - the runs were dropped,
    # not failed (44 of 48 that did start succeeded). Scheduled Actions are best-effort and
    # the top and bottom of the hour are the most contended slots on the platform, so an
    # odd minute gets dropped less. It is still best-effort: the only way to guarantee the
    # 30-minute cadence is an external workflow_dispatch, which is never dropped
    # (scripts/dispatch_refresh.ps1).
    - cron: "13,43 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/refresh-data.yml"] # self-test on changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: sqlite+pysqlite:///./aerp.db
      AERP_PSX_CSV_DIR: ../data/psx_csv
      AERP_PSX_INSIDER_CSV: ../data/psx_insider.csv
      AERP_SEED_ON_STARTUP: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: Unpack PSX CSV inputs
        run: |
          mkdir -p data/psx_csv
          tar xzf data/psx_csv.tar.gz -C data

      - name: Run pipeline + export snapshot
        working-directory: backend
        run: |
          python -m app.cli init-db
          python -m app.cli seed
          # The curated universe - indices, forex, commodities, crypto. `seed` creates the
          # MARKETS; only this loads the SYMBOLS into them, and it was never being called
          # here. The index rows in the snapshot were survivors, carried forward run after
          # run by the export merge from whenever someone last ran this by hand, so the list
          # had quietly become append-only-by-accident: adding ^KSE100 and DFMGI.AE to
          # universe_curated.INDICES changed nothing at all, and Pakistan's regime kept
          # publishing a three-week-old index reading while Dubai had no index signal.
          # Idempotent - it upserts, so re-running it every 30 minutes adds nothing new.
          #
          # Deliberately NOT `|| true`. The first version of this line had one, and after it
          # shipped the two index rows still did not appear - leaving no way to tell whether
          # the command had run and done nothing, or failed and been swallowed. That is the
          # exact failure mode this whole day's work has been about, reintroduced by me in
          # the fix for it. If loading the universe breaks, the run should say so.
          python -m app.cli load-markets
          # And prove the outcome rather than assuming it: these two are the reason the step
          # exists, and a silent zero here is the thing to catch. (No heredoc - the YAML
          # indentation would arrive in Python as leading whitespace.)
          # Emitted as a ::warning:: rather than a plain print, because job logs need an
          # authenticated token to read and annotations do not - so this is visible without
          # one, which is the whole point of a diagnostic.
          python -c "from app.db.session import session_scope; from app.models.market import Security; db=session_scope().__enter__(); [print(('universe-check ok: %s id=%s provider=%s active=%s' % (s, r.id, r.provider_symbol, r.is_active)) if r else ('::warning::universe-check: %s IS ABSENT from the database after load-markets' % s)) for s in ('^KSE100','DFMGI.AE') for r in [db.query(Security).filter(Security.symbol==s).one_or_none()]]"
          python -m app.cli ingest-psx || true
          python -m app.cli ingest-psx-market || true
          python -m app.cli ingest-macro || true
          python -m app.cli ingest-psx-insider || true
          python -m app.cli ingest-psx-insider-api || true
          python -m app.cli ingest-news --limit 40 || true
          python -m app.cli compute || true
          python -m app.cli export-static
          # Keyless delayed-price refresh for non-PSX markets (US/India/GCC/AUS/forex/…)
          # via Yahoo's chart v8 endpoint, which — unlike yfinance — is reachable from CI.
          # Patches only price fields in the snapshot; never touches scores/fundamentals.
          # Cap to the top names by composite (screener is composite-sorted) so the ~11k
          # universe doesn't blow the 30-min budget / trip Yahoo rate limits. PSX prices come
          # from one market-watch request regardless of the cap.
          # Runs every 30 minutes, so it stays capped - but refresh-prices now takes the
          # STALEST rows first, which makes the cap a rotation instead of a permanent
          # exclusion. Whatever misses this cycle is at the front of the next one, and the
          # uncapped daily run guarantees every symbol is repriced at least once a day.
          python -m app.cli refresh-prices --limit 3000 || true

      - name: Detect new alerts
        run: |
          git show HEAD:frontend/public/data/catalysts.json > /tmp/old_cat.json 2>/dev/null || echo '{}' > /tmp/old_cat.json
          COUNT=$(python scripts/diff_new_alerts.py /tmp/old_cat.json /tmp/alert_body.txt || echo 0)
          echo "NEW_ALERTS=$COUNT" >> "$GITHUB_ENV"
          echo "Detected $COUNT new alert(s)."

      # The "Email new alerts" step was removed on 2026-08-18, for the same reason as the one
      # in daily-refresh.yml: with MAIL_TO unset it annotated every run with a failure while
      # `continue-on-error` hid the consequence. At 48 runs a day this was the loudest thing
      # in the annotations and none of it meant anything.
      #
      # Detection above is kept - the alert diff still runs and logs its count. See
      # daily-refresh.yml for how to restore delivery once the mail secrets exist.

      - name: Commit refreshed snapshot (for the record)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data data/prices

          # screener.json (11.6 MB) and movers.json (4.3 MB) are ~1.4 MB of packed history
          # EVERY run. That was fine at the 5 runs a day GitHub's scheduler actually
          # delivered; at 48 it is ~2 GB a month, and the repo is already 246 MB. So they go
          # in every 6 hours rather than every run.
          #
          # Safe to hold back because neither is state: export-static rebuilds both from the
          # database on every run, and Pages is built from the working tree, not from git -
          # so the published site always carries the newest copy either way. Everything else
          # under data/ is still committed every run, catalysts.json above all: the new-alert
          # diff reads its previous version out of git, so throttling THAT would re-send the
          # same alerts for six hours.
          mark=frontend/public/data/.snapshot_committed_at
          last=$(cat "$mark" 2>/dev/null || echo 0)
          if [ "$(( $(date +%s) - last ))" -ge 21600 ]; then
            date +%s > "$mark"
            git add -f "$mark" frontend/public/data/screener.json \
                               frontend/public/data/movers.json
          else
            git restore --staged frontend/public/data/screener.json \
                                 frontend/public/data/movers.json 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            # There used to be a `git pull --rebase --autostash -q origin main || true` here,
            # before the commit, with this run's output already staged. It is what made THIS
            # workflow fail while the daily refresh - which has no such line - succeeded on the
            # same commit. Rebasing a 10,000-file generated snapshot conflicts, `|| true`
            # swallowed the error, and the repo was left mid-rebase; after that nothing can
            # commit, merge or push, so all five retries failed and the run died having done
            # all its work. Racing is handled properly below, after the commit exists.
            bash scripts/commit_snapshot.sh "chore: refresh demo data snapshot"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Pages site
        working-directory: frontend
        run: npm install && npm run build
        env:
          VITE_BASE: /AERP/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Each run asks for the next one, so the cadence does not depend on GitHub's scheduler -
  # which measurably drops ~90% of what the cron above asks for. A workflow_dispatch is the
  # documented exception to "the default GITHUB_TOKEN cannot trigger workflows", so this
  # needs no personal access token and nothing outside GitHub. The cron stays as the thing
  # that restarts the loop if it ever stops.
  chain:
    needs: [build, deploy]
    if: always() # a failed run must still hand off, or the loop dies on the first bad day
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Target wall-clock between run STARTS. A run takes ~13 min, so most of this is the
      # wait. Set it to 0 for back-to-back runs (~13-minute data, same runner cost).
      CYCLE_MINUTES: "30"
    steps:
      - name: Wait out the cycle, then ask for the next run
        run: |
          # Every failure reports itself as an ::error:: annotation, because downloading job
          # logs from the API needs admin rights on the repo and annotations do not. If this
          # step dies quietly the whole loop stops, so it must say why.
          set -uo pipefail

          started=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          if [ -z "${started:-}" ]; then
            echo "::error::chain: could not read run_started_at - not chaining."
            exit 1
          fi
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          remain=$(( CYCLE_MINUTES * 60 - elapsed ))
          if [ "$remain" -gt 0 ]; then
            echo "Run started $started (${elapsed}s ago); waiting ${remain}s."
            sleep "$remain"
          fi

          # Checked AFTER the wait, not before: the cron can fire while we sleep, and that
          # run is then the loop. Dispatching anyway would leave two chains, then four - the
          # interval halving every time until the repo is running Actions continuously.
          live=$(gh api "repos/$REPO/actions/workflows/refresh-data.yml/runs?per_page=50" \
                   --jq "[.workflow_runs[]
                          | select(.id != ${{ github.run_id }})
                          | select(.status != \"completed\")] | length")
          live=${live:-0}
          if [ "$live" -gt 0 ]; then
            echo "$live other run(s) already pending - they carry the loop. Not chaining."
            exit 0
          fi

          # -R is not optional: this job deliberately skips actions/checkout (it only needs
          # the API), so gh has no git remote to infer the repository from and exits 1.
          if ! out=$(gh workflow run refresh-data.yml --ref main -R "$REPO" 2>&1); then
            echo "::error::chain: dispatch failed: ${out}"
            exit 1
          fi
          echo "Next refresh requested."

  freshness:
    # A SEPARATE job that needs `build` but does not gate `deploy`. The check must be able to
    # turn the run red without stopping good data from shipping: one stale artifact should be
    # visible, not a reason to withhold the other twenty-three that are fine. Deploy runs in
    # parallel off the same `needs: build`.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Verify nothing was silently left stale
        working-directory: backend
        # Deliberately NOT `|| true`. Every other step in this pipeline is fail-open, which is
        # precisely why something was always quietly out of date - a step that failed was
        # skipped, the export carried the previous value forward, and the run reported success.
        # This is the post-condition, and it is the one command allowed to fail.
        run: python -m app.cli verify-freshness --out ../frontend/public/data
