name: Fundamentals Refresh (all markets)

# Runs daily and refreshes only the companies that just reported, so a company filing today has
# its fundamentals updated tomorrow. It never re-scrapes the ~11k universe.
#
# Where the "who reported" signal comes from, and how good it is - the differences are real and
# the backstop exists because of them:
#
#   PSX         exchange announcements in catalysts.json. Per company, complete.
#   US          the stockanalysis earnings calendar lists every company reporting that day.
#               Complete. It has no date navigation, so we read "today" and this job's daily
#               cadence is what turns that into next-day coverage.
#   India / AU  no announcement feed we can rely on - the news feed is capped at ~40 items per
#               region, so it catches large names only.
#
# Because of that last line the job always mixes in a quota of the longest-stale companies.
# That is what guarantees every company is eventually refreshed even where no signal exists;
# without it the gaps would be silent and the job would report success every day regardless.
#
# Safe by construction:
#   * the scraper writes a complete statement or nothing (it refuses tables below MIN_ROWS), so
#     a throttled run is a no-op rather than a source of bad data
#   * consolidation MERGES, so a run holding a handful of CSVs cannot delete the thousands of
#     companies that did not report
#   * we commit only when the store actually changed
on:
  schedule:
    - cron: "40 5 * * *" # daily 05:40 UTC - after the US close and the day's filings
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols to refresh (blank = auto from announcements)"
        required: false
        default: ""
      days:
        description: "How far back to look for announcements"
        required: false
        default: "3"
      backstop:
        description: "Stale companies to mix in, for markets with no announcement feed"
        required: false
        default: "40"
      max_symbols:
        description: "Cap per run, to keep the job well inside the Actions time limit"
        required: false
        default: "250"

permissions:
  contents: write

concurrency:
  group: fundamentals-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The FULL backend requirements, as every other workflow that runs app.cli installs. This
      # job named three packages by hand and the CLI needs more than three: pending-results
      # imports httpx, which was not among them, so every `python -m app.cli` call died on
      # ModuleNotFoundError. `|| true` swallowed it, the job announced "Pending: 0", and the
      # two steps that do the actual work were skipped by their own `if:`.
      - run: pip install -r backend/requirements.txt
      - run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Companies reporting today (US calendar)
        id: cal
        run: echo "symbols=$(python scripts/earnings_calendar.py)" >> "$GITHUB_OUTPUT"

      - name: Work out who has results we do not hold - EVERY market
        id: pick
        working-directory: backend
        run: |
          MANUAL="${{ github.event.inputs.symbols }}"
          if [ -n "$MANUAL" ]; then
            echo "symbols=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAYS="${{ github.event.inputs.days }}"
          # One list per market, each the union of recent announcements and a direct probe of
          # the source. The probe is what makes it complete: catalysts.json is a rolling window
          # and named 17 PSX companies when 50 had filed. Only names whose newest held period is
          # old enough to have been superseded are asked, which takes the five markets from
          # 11,684 requests to about 9,700 - roughly seven minutes rather than an hour and three
          # quarters.
          OK=0
          for REGION in us india australia psx gcc; do
            # One market failing must not lose the other four - but ALL of them failing is not
            # a quiet day, it is a broken job, and it reported success as "Pending: 0" for
            # weeks. Count the ones that worked and insist on at least one.
            if python -m app.cli pending-results --region "$REGION" --days "${DAYS:-5}" \
                 --data-dir ../frontend/public/data; then
              OK=$((OK + 1))
            else
              echo "::warning::pending-results failed for $REGION"
            fi
          done
          if [ "$OK" -eq 0 ]; then
            echo "::error::pending-results failed for EVERY market - refusing to report success"
            exit 1
          fi
          cd ..
          cat data/pending/*.txt 2>/dev/null | grep -v '^#' | grep -v '^$' | sort -u > /tmp/pending_all.txt
          SYMS=$(paste -sd, - < /tmp/pending_all.txt)
          echo "symbols=$SYMS" >> "$GITHUB_OUTPUT"
          echo "Pending across all markets: $(wc -l < /tmp/pending_all.txt) (from $OK of 5 markets)"

      - name: Re-scrape them
        if: steps.pick.outputs.symbols != ''
        run: |
          python scripts/scrape_fundamentals.py \
            --regions us,india,australia,psx,gcc \
            --symbols "${{ steps.pick.outputs.symbols }}" \
            --workers 3 --page-pause 0.5 --work 300 --rest 0

      - name: Merge into the store, then push it into the snapshot
        if: steps.pick.outputs.symbols != ''
        working-directory: backend
        run: |
          set -e
          python -m app.cli consolidate-fundamentals
          # Consolidating alone changes NOTHING a user can see. The score reads statements_ttm
          # inside the company files, so freshly scraped results sat in the store while the
          # dashboard kept showing last quarter. That is exactly what happened: FFC has carried
          # Q2 2026 at the source for days and every PSX company still scored to Mar-26.
          python -m app.cli apply-fundamentals --data-dir ../frontend/public/data

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # NOT data/pending: it is gitignored, and `git add` on an ignored path is a fatal
          # error, not a skip. That alone failed this job in 59 seconds every run - after the
          # missing dependency had already emptied the symbol list and skipped the real work.
          # The lists are rebuilt from scratch at the start of every run, so nothing is lost.
          git add data/fundamentals_ttm frontend/public/data/company
          if git diff --cached --quiet; then
            echo "Store unchanged - nothing to commit."
          else
            git commit -m "data: refresh fundamentals for companies that reported"
            git push
          fi
