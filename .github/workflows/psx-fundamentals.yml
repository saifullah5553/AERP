name: PSX Fundamentals Refresh

# Twice a week during results season, re-scrape the stockanalysis financials for ONLY the
# PSX companies that recently announced results (from catalysts.json), refresh their CSVs,
# and commit the updated data/psx_csv.tar.gz. The 30-min "Refresh Demo Data" pipeline then
# re-ingests those CSVs (ingest-psx → compute → export) automatically.
#
# Why Playwright: stockanalysis renders the full statement tables client-side, so a keyless
# httpx fetch only sees condensed summaries — the browser scrape is the only way to get the
# full income/balance/cash-flow detail the fundamental engine needs.
#
# Safe by construction: the scraper writes complete CSVs or nothing, and we commit only when
# something actually changed — a blocked/empty run is a harmless no-op (no bad data).
on:
  schedule:
    - cron: "20 2 * * 1,4" # Mon & Thu 02:20 UTC
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated PSX symbols to refresh (blank = auto from recent results)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright pandas && python -m playwright install --with-deps chromium

      - name: Unpack existing PSX CSVs
        run: |
          mkdir -p data/psx_csv
          tar xzf data/psx_csv.tar.gz -C data 2>/dev/null || true

      - name: Work out who has results we do not hold
        id: pick
        run: |
          MANUAL="${{ github.event.inputs.symbols }}"
          if [ -n "$MANUAL" ]; then
            echo "SYMS=$MANUAL" >> "$GITHUB_ENV"
            echo "Manual list: $MANUAL"
          else
            # Announcements alone are not enough. catalysts.json is a rolling window - on
            # 5 Aug it held nothing before 3 Aug, so it offered 17 PSX names when 50 had
            # actually filed. The probe reads each company's newest reported period straight
            # from the source and compares it with what our store holds, which cannot miss a
            # filer however the announcement was worded or whether it aged out.
            cd backend
            python -m app.cli pending-results --region psx --days 5               --data-dir ../frontend/public/data
            cd ..
            # `grep -v` exits 1 when it matches nothing, and a missing file exits 2. Either
            # way `set -e` failed the job on the NORMAL outcome: no company filed today. This
            # workflow is supposed to run often and do nothing most of the time, so "nothing
            # pending" has to be a clean skip, not a red run. PSX Fundamentals failed this way
            # on every scheduled run it made.
            SYMS=$(grep -v '^#' data/pending/psx.txt 2>/dev/null | paste -sd, - || true)
            echo "SYMS=$SYMS" >> "$GITHUB_ENV"
            if [ -z "$SYMS" ]; then
              echo "No PSX company has filed a period we do not already hold. Nothing to do."
            else
              echo "Pending: $SYMS"
            fi
          fi

      - name: Scrape refreshed fundamentals (targeted, forced)
        if: ${{ env.SYMS != '' }}
        env:
          AERP_PSX_CSV_DIR: data/psx_csv
          AERP_PSX_SYMBOLS: ${{ env.SYMS }}
          AERP_PSX_FORCE: "1"
        run: python scripts/scrape_psx.py || true

      - name: Feed the scrape into the store the SCORE reads
        if: ${{ env.SYMS != '' }}
        working-directory: backend
        run: |
          # The CSVs alone only reach the database, via ingest-psx. The fundamental score is
          # computed from statements_ttm in the company files, which come from the consolidated
          # store - so without these two commands a freshly announced quarter is scraped,
          # committed, ingested, and still never scored.
          # Loudly, and before it is needed: swallowing this makes the two commands below
          # fail on a missing import and then be swallowed themselves, so the job reports
          # success having scored nothing.
          pip install -r requirements.txt
          python -m app.cli consolidate-fundamentals --csv-dir ../data --regions psx || true
          python -m app.cli apply-fundamentals --regions psx --data-dir ../frontend/public/data || true
          # Applying the statements is not the end of it. The fundamental score and the DCF
          # fair value are both computed FROM statements_ttm, so without these two the new
          # quarter lands in the company files and every published score still describes the
          # old one. refresh-quality recomputes the score and the valuation; the history pass
          # adds the new quarter to the per-quarter series the ledger ranks on.
          python -m app.cli refresh-quality --out ../frontend/public/data || true
          python -m app.cli refresh-quality-history --out ../frontend/public/data || true

      - name: Re-pack and commit if changed
        if: ${{ env.SYMS != '' }}
        run: |
          tar czf data/psx_csv.tar.gz -C data psx_csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # NOT data/pending - it is gitignored, and `git add` on an ignored path is a
          # fatal error rather than a skip. Same fault as fundamentals-refresh.yml.
          git add data/psx_csv.tar.gz data/fundamentals_ttm frontend/public/data/company
          if git diff --cached --quiet; then
            echo "No fundamentals changed."
          else
            git commit -m "chore: refresh PSX fundamentals CSVs (recent results)"
            pushed=""
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=yes; break; fi
              echo "push rejected (attempt $attempt) - rebasing onto origin/main"
              git pull --rebase --autostash origin main || break
              sleep $((attempt * 10))
            done
            if [ -z "$pushed" ]; then
              echo "::error::could not push after 5 attempts - this run's work was computed and then lost"
              exit 1
            fi
          fi
