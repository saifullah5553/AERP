name: PSX Fundamentals Refresh

# Once a day, re-scrape the stockanalysis financials for ONLY the PSX companies with results we do
# not hold, fold them into the store and the scores, and commit the updated data/psx_csv.tar.gz.
#
# Why Playwright: stockanalysis renders the full statement tables client-side, so a keyless
# httpx fetch only sees condensed summaries — the browser scrape is the only way to get the
# full income/balance/cash-flow detail the fundamental engine needs.
#
# Safe by construction: the scraper writes complete CSVs or nothing, and we commit only when
# something actually changed — a blocked/empty run is a harmless no-op (no bad data).
#
# Everything it publishes is built on the tip as it stands after the scrape, because the scrape
# takes over an hour and other jobs write the same store and company files. See publish_on_tip.sh.
on:
  schedule:
    - cron: "20 2 * * *" # ONCE DAILY, 02:20 UTC (was Mon & Thu)
  push:
    paths: [".github/workflows/psx-fundamentals.yml"] # self-test on changes
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated PSX symbols to refresh (blank = auto from recent results)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # An 84-minute scrape, plus up to three 15-minute builds if the tip keeps moving. The limit kills
    # the job and loses the whole scrape, so it needs room above that worst case.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The FULL backend requirements. `python -m app.cli` needs pydantic-settings and httpx
      # among others, and this job installed only playwright and pandas - so pending-results
      # died on import and the workflow failed in under two minutes on every scheduled run.
      - run: pip install -r backend/requirements.txt
      - run: pip install playwright pandas && python -m playwright install --with-deps chromium

      - name: Work out who has results we do not hold
        id: pick
        run: |
          MANUAL="${{ github.event.inputs.symbols }}"
          if [ -n "$MANUAL" ]; then
            echo "SYMS=$MANUAL" >> "$GITHUB_ENV"
            echo "Manual list: $MANUAL"
          else
            # Announcements alone are not enough. catalysts.json is a rolling window - on
            # 5 Aug it held nothing before 3 Aug, so it offered 17 PSX names when 50 had
            # actually filed. The probe reads each company's newest reported period straight
            # from the source and compares it with what our store holds, which cannot miss a
            # filer however the announcement was worded or whether it aged out.
            cd backend
            python -m app.cli pending-results --region psx --days 5               --data-dir ../frontend/public/data
            cd ..
            # `grep -v` exits 1 when it matches nothing, and a missing file exits 2. Either
            # way `set -e` failed the job on the NORMAL outcome: no company filed today. This
            # workflow is supposed to run often and do nothing most of the time, so "nothing
            # pending" has to be a clean skip, not a red run. PSX Fundamentals failed this way
            # on every scheduled run it made.
            SYMS=$(grep -v '^#' data/pending/psx.txt 2>/dev/null | paste -sd, - || true)
            echo "SYMS=$SYMS" >> "$GITHUB_ENV"
            if [ -z "$SYMS" ]; then
              echo "No PSX company has filed a period we do not already hold. Nothing to do."
            else
              echo "Pending: $SYMS"
            fi
          fi

      # Into an ignored folder, so that it survives the reset onto the tip, and on its own, so that
      # consolidating reads only what this run fetched, as the Fundamentals job does.
      - name: Scrape refreshed fundamentals (targeted, forced)
        if: ${{ env.SYMS != '' }}
        env:
          AERP_PSX_CSV_DIR: data/fundamentals_csv/psx
          AERP_PSX_SYMBOLS: ${{ env.SYMS }}
          AERP_PSX_FORCE: "1"
        run: python scripts/scrape_psx.py || true

      # NOT data/pending in the paths: it is gitignored, and `git add` on an ignored path is a fatal
      # error rather than a skip. Same fault as fundamentals-refresh.yml.
      - name: Pack the scrape, rescore, and publish, all on the current tip
        if: ${{ env.SYMS != '' }}
        run: |
          if ! ls data/fundamentals_csv/psx/*.csv >/dev/null 2>&1; then
            echo "::warning::${SYMS} pending but the scrape saved nothing - blocked or throttled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/publish_on_tip.sh "chore: refresh PSX fundamentals CSVs (recent results)" \
            "bash scripts/psx_pack_scrape.sh data/fundamentals_csv/psx && bash scripts/rescore_fundamentals.sh" \
            data/psx_csv.tar.gz data/fundamentals_ttm frontend/public/data/company
