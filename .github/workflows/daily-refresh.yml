name: Daily Technical Refresh

# After market close, recompute the technical → composite → signal for every market from
# Yahoo chart-v8 daily history (reachable from CI, unlike yfinance) and reblend with the
# committed fundamental/momentum/quality/risk. This is what makes signals + Movers update
# daily across all markets. Patches the snapshot directly (no DB), commits, and deploys.
# refresh-technicals also backfills real PSX signal-inception dates, anchored to the committed
# composite. These used to come from the PSX portal's EOD endpoint, which turned out to serve
# the KSE-100 index and then disconnect for every individual company — so the backfill silently
# produced nothing for all 453 names. It now reads our own bar store instead: 453/453 dated.
on:
  schedule:
    - cron: "15 22 * * *" # 22:15 UTC (after US close; offset from the 30-min refresh)
  workflow_dispatch:
  push:
    paths: [".github/workflows/daily-refresh.yml"] # self-test on changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Deliberately NOT the "pages" group. Sharing it with the half-hourly price refresh is what
  # killed this job: GitHub keeps only the newest PENDING run per group, so when this queued
  # behind a price run at 22:15 the next price run at 22:35 cancelled it. Over the last 100
  # runs this workflow completed ONCE. Technicals are a once-a-day job after the last market
  # closes; they must not be starved by a job that runs 48 times a day.
  #
  # Decoupling means two workflows can push in the same minute. That is handled at the push
  # (scripts/commit_snapshot.sh) rather than by serialising a 40-minute job behind a 3-minute
  # one.
  group: technical-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      - name: Refresh prices + recompute technicals (all markets, chart-v8)
        working-directory: backend
        run: |
          # No cap. The cap was supposed to protect the CI budget, but the whole 11k universe
          # measures ~4 minutes at 8 workers in a 120-minute job - and because the screener is
          # composite-sorted it always refreshed the same head of the list, so 6,069 symbols
          # were never repriced at all. FCUV showed its 31 July close for eight days while the
          # real price fell 11.60 -> 5.20. Two minutes saved was not worth a stale price.
          # Benchmarks first: the quarterly history compares every market against its index,
          # and a stale index makes the comparison quietly wrong rather than visibly missing.
          python -m app.cli refresh-indices || true
          python -m app.cli refresh-prices || true
          # No limit: patterns and the strategy's entry timing need an OHLC pass over the WHOLE
          # universe, otherwise most names never get a candlestick/chart pattern at all.
          python -m app.cli refresh-technicals || true
          # Quality needs no prices, so score every stock from stored statements first - it is
          # local, fast, and can't be starved by a fetch limit or a rate limiter.
          python -m app.cli refresh-quality || true
          # Per-company news via Google News RSS (keyless). Snapshot is composite-sorted, so
          # --limit refreshes the highest-scored names first; the rest fill over subsequent runs.
          python -m app.cli refresh-news --limit 250 || true
          # Write down today's BUY/HOLD calls BEFORE the outcome is known, then score the
          # running record. This builds a forward-looking track record, not a backtest.
          python -m app.cli journal-signals || true
          python -m app.cli evaluate-journal || true
          # Model portfolio: marks holdings to today's prices every run, and rebalances itself
          # once per calendar quarter as new results land (adds the new top scorers, drops the
          # names that fell out). The command is idempotent within a quarter.
          python -m app.cli model-portfolio || true

      - name: Detect new Buy/Exit signals
        run: |
          git show HEAD:frontend/public/data/signal_moves.json > /tmp/old_sig.json 2>/dev/null || echo '{}' > /tmp/old_sig.json
          COUNT=$(python scripts/diff_new_signals.py /tmp/old_sig.json /tmp/signal_body.txt || echo 0)
          echo "NEW_SIGNALS=$COUNT" >> "$GITHUB_ENV"
          echo "Detected $COUNT new buy/exit signal(s)."

      # The "Email new Buy/Exit signals" step was removed on 2026-08-18. `continue-on-error`
      # kept it from failing the job, but with MAIL_TO unset it still recorded a failure
      # annotation ("At least one of 'to', 'cc' or 'bcc' must be specified") on every single
      # run - which is exactly the noise that makes a real annotation easy to miss.
      #
      # The detection step above is KEPT: it is local, costs nothing, and logs the count, so
      # the signal diff is still visible in the run. To restore delivery, set the MAIL_TO,
      # MAIL_USERNAME and MAIL_PASSWORD secrets and re-add a `dawidd6/action-send-mail@v3`
      # step guarded on `env.NEW_SIGNALS` and on the secret being present, e.g.
      #     if: ${{ env.NEW_SIGNALS != '0' && env.NEW_SIGNALS != '' && secrets.MAIL_TO != '' }}
      # so an unconfigured mailbox stays silent instead of annotating.

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/prices too: refresh-technicals folds the day's closes into the packed price
          # history, and an uncommitted pack means the next run prices from stale bars - or,
          # on a fresh runner, from none, which rebuilt every quarterly history as zero trades.
          git add frontend/public/data data/prices
          if git diff --cached --quiet; then
            echo "No changes."
          else
            # Commit + push, replaying this run's files onto the current origin/main if
            # another job wins the race. The script needs no merge base and no history, and
            # it leaves files only the remote has untouched.
            bash scripts/commit_snapshot.sh "chore: daily technical/score refresh"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Pages site
        working-directory: frontend
        run: npm install && npm run build
        env:
          VITE_BASE: /AERP/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  freshness:
    # A SEPARATE job that needs `build` but does not gate `deploy`. The check must be able to
    # turn the run red without stopping good data from shipping: one stale artifact should be
    # visible, not a reason to withhold the other twenty-three that are fine. Deploy runs in
    # parallel off the same `needs: build`.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Verify nothing was silently left stale
        working-directory: backend
        # Deliberately NOT `|| true`. Every other step in this pipeline is fail-open, which is
        # precisely why something was always quietly out of date - a step that failed was
        # skipped, the export carried the previous value forward, and the run reported success.
        # This is the post-condition, and it is the one command allowed to fail.
        run: python -m app.cli verify-freshness --out ../frontend/public/data
