name: Probe Data Sources

# One-shot diagnostic: from a GitHub US runner, check which KEYLESS price sources are
# reachable and what they cover. Writes the results to probe-result.txt and commits it
# so it can be read without Actions-log access. Safe to delete after reading.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-sources.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe keyless sources
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          OUT=probe-result.txt
          : > "$OUT"
          hr() { echo "" >> "$OUT"; echo "=== $1 ===" >> "$OUT"; }
          grab() { curl -s --max-time 15 -H "User-Agent: $UA" "$1" | head -c 400 >> "$OUT"; echo "" >> "$OUT"; }

          echo "probe run at $(date -u)" >> "$OUT"
          hr "Stooq US aapl.us";        grab "https://stooq.com/q/l/?s=aapl.us&f=sd2t2ohlcv&h&e=csv"
          hr "Stooq India reliance.in"; grab "https://stooq.com/q/l/?s=reliance.in&f=sd2t2ohlcv&h&e=csv"
          hr "Stooq Saudi 1010.sr";     grab "https://stooq.com/q/l/?s=1010.sr&f=sd2t2ohlcv&h&e=csv"
          hr "Stooq AUS bhp.au";        grab "https://stooq.com/q/l/?s=bhp.au&f=sd2t2ohlcv&h&e=csv"
          hr "Stooq forex eurusd";      grab "https://stooq.com/q/l/?s=eurusd&f=sd2t2ohlcv&h&e=csv"
          hr "Yahoo v8 US AAPL";        grab "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=1d&interval=1d"
          hr "Yahoo v8 India RELIANCE.NS"; grab "https://query1.finance.yahoo.com/v8/finance/chart/RELIANCE.NS?range=1d&interval=1d"
          hr "Yahoo v8 Saudi 1010.SR";  grab "https://query1.finance.yahoo.com/v8/finance/chart/1010.SR?range=1d&interval=1d"
          hr "Yahoo v8 AUS BHP.AX";     grab "https://query1.finance.yahoo.com/v8/finance/chart/BHP.AX?range=1d&interval=1d"
          hr "Binance BTCUSDT";         grab "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT"
          echo "" >> "$OUT"; echo "=== done ===" >> "$OUT"
          cat "$OUT"

      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "chore: data-source probe result" || echo "no change"
          git push || echo "push skipped"
