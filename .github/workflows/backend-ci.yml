name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app
        continue-on-error: true  # advisory in Phase 1; enforced from Phase 3

      - name: Tests (pytest)
        # The summary is echoed back as ::error:: annotations on failure. Downloading job logs
        # from the API needs admin rights on the repo; annotations do not, so a red build can
        # actually be diagnosed from the notification instead of guessed at. This suite passes
        # on Windows and has failed on this Linux runner before, so "it works locally" is not
        # evidence of anything.
        run: |
          set +e
          pytest -q --tb=short 2>&1 | tee pytest-out.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest-out.txt | while read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$code"
